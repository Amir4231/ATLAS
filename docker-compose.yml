services:
  postgres:
    image: postgres:16
    mem_limit: 1024m
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=100"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    mem_limit: 128m
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    mem_limit: 100m
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://atlas:atlas@postgres:5432/atlas?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: ${JWT_SECRET}
      UPLOAD_DIR: /data/uploads
      SEED: "true"
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    mem_limit: 32m
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web:/usr/share/nginx/html:ro
      - uploads:/usr/share/nginx/uploads:ro
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  uploads:
