<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas — Class Rep</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="topbar">
  <a href="index.html" class="topbar__brand">
    <div class="topbar__brand-icon">A</div>
    Atlas
  </a>
  <div class="topbar__user">
    <span class="topbar__email" id="who"></span>
    <button class="btn btn--ghost btn--sm" id="out">Sign out</button>
  </div>
</nav>

<div class="page-wrap">
  <div class="page-header">
    <h1>Class Rep</h1>
    <p>Open a session, display the code, and watch check-ins in real time.</p>
  </div>

  <!-- Session control -->
  <section>
    <div class="section-title">
      <div class="section-title__icon">🎓</div>
      <h2>Session control</h2>
    </div>
    <div class="field">
      <label for="cls">Class</label>
      <select id="cls"></select>
    </div>
    <div class="btn-row">
      <button id="open" class="btn btn--primary">Open session</button>
      <button id="close" class="btn btn--danger" disabled>Close session</button>
    </div>
    <div id="m" class="msg"></div>
  </section>

  <!-- QR hero — hidden until session is open -->
  <div id="qrSection" style="display:none">
    <div class="qr-hero">
      <div style="display:flex;align-items:center;gap:.5rem">
        <span class="pulse"></span>
        <span id="sessLabel" class="qr-hero__session font-semibold">Session active</span>
      </div>

      <div class="qr-hero__qr-wrap" id="qr"></div>
      <p id="qrFallback" style="color:var(--danger);font-size:.8125rem;margin:0"></p>

      <div class="qr-hero__code" id="code">—</div>
      <div class="btn-row" style="justify-content:center">
        <button id="copyCode" class="btn btn--ghost btn--sm" type="button">Copy code</button>
        <button id="copyLink" class="btn btn--ghost btn--sm" type="button">Copy join link</button>
      </div>
      <p id="shareHint" class="text-subtle text-xs" style="margin:0;word-break:break-all"></p>
      <div class="qr-hero__timer" id="cd">Waiting…</div>
    </div>
  </div>

  <!-- Live feed — hidden until session is open -->
  <section id="feedSection" style="display:none">
    <div class="section-title">
      <div class="section-title__icon">👥</div>
      <h2>Live check-ins</h2>
    </div>
    <ul id="feed" class="item-list">
      <li><span class="empty" style="padding:1.25rem 0;display:block">Waiting for check-ins…</span></li>
    </ul>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="app.js"></script>
<script>
(function () {
  var sessionId = 0, pollT = null, cdT = null, expAt = 0, qrObj = null;

  Atlas.el('out').onclick = Atlas.logout;

  Atlas.requireRole(['class_rep', 'rep', 'admin']).then(function (me) {
    if (!me) return;
    Atlas.el('who').textContent = me.email + ' (' + me.role + ')';
    loadClasses();
  });

  async function loadClasses() {
    var r = await Atlas.api('GET', '/v1/classes');
    if (r.status !== 200) { Atlas.msg('m', 'Could not load classes (' + r.status + ').', true); return; }
    Atlas.el('cls').innerHTML = r.data.classes.map(function (c) {
      return '<option value="' + c.id + '">' + c.class_name + ' (#' + c.id + ')</option>';
    }).join('');
  }

  Atlas.el('open').onclick = async function () {
    var btn = Atlas.el('open');
    btn.classList.add('loading'); btn.disabled = true;
    var r = await Atlas.api('POST', '/v1/qr/session', { class_id: +Atlas.el('cls').value });
    btn.classList.remove('loading'); btn.disabled = false;
    if (r.status !== 200) { Atlas.msg('m', 'Failed to open session (' + r.status + '): ' + (r.data.error || ''), true); return; }

    sessionId = r.data.session_id || r.data.id;
    Atlas.el('sessLabel').textContent = 'Session #' + sessionId + ' · live';
    Atlas.el('close').disabled = false;
    Atlas.el('qrSection').style.display = '';
    Atlas.el('feedSection').style.display = '';
    Atlas.msg('m', 'Session #' + sessionId + ' is open. Share the QR or code below.', false);
    tick(); pollFeed();
    clearInterval(pollT);
    pollT = setInterval(function () { tick(); pollFeed(); }, 5000);
  };

  Atlas.el('close').onclick = async function () {
    if (!sessionId) return;
    var btn = Atlas.el('close');
    btn.classList.add('loading'); btn.disabled = true;
    var r = await Atlas.api('POST', '/v1/qr/session/' + sessionId + '/close', {});
    btn.classList.remove('loading');
    clearInterval(pollT); clearInterval(cdT);

    if (r.status === 200) {
      Atlas.msg('m', 'Session closed — ' + (r.data.marked || 0) + ' student(s) marked present.', false);
    } else {
      Atlas.msg('m', 'Close failed (' + r.status + ').', true);
      btn.disabled = false;
    }
    Atlas.el('code').textContent = '—';
    Atlas.el('cd').textContent = '';
    Atlas.el('cd').className = 'qr-hero__timer';
    Atlas.el('shareHint').textContent = '';
    Atlas.el('qrSection').style.display = 'none';
    Atlas.el('feedSection').style.display = 'none';
    sessionId = 0;
  };

  async function tick() {
    if (!sessionId) return;
    var r = await Atlas.api('GET', '/v1/qr/session/' + sessionId + '/code');
    if (r.status !== 200) {
      Atlas.msg('m', 'Code refresh failed (' + r.status + ').', true);
      if (r.status === 410) clearInterval(pollT);
      return;
    }
    var code = r.data.code;
    var exp  = r.data.exp != null ? r.data.exp : r.data.expires_at;
    Atlas.el('code').textContent = code;
    Atlas.el('shareHint').textContent = 'Join link: ' + Atlas.joinLink(sessionId);
    expAt = (typeof exp === 'number') ? exp * 1000 : Date.parse(exp);
    if (!expAt) expAt = Date.now() + 30000;
    drawQR(sessionId, code);
    clearInterval(cdT);
    countdown();
    cdT = setInterval(countdown, 1000);
  }

  function countdown() {
    var s = Math.max(0, Math.round((expAt - Date.now()) / 1000));
    var el = Atlas.el('cd');
    el.textContent = '⏱ Refreshes in ' + s + 's';
    el.className = 'qr-hero__timer' + (s <= 8 ? ' urgent' : '');
    if (s <= 0) clearInterval(cdT);
  }

  function drawQR(sid, code) {
    var box = Atlas.el('qr');
    if (!window.QRCode) {
      box.innerHTML = '';
      Atlas.el('qrFallback').textContent = 'QR unavailable (CDN blocked) — students can type the code above.';
      return;
    }
    Atlas.el('qrFallback').textContent = '';
    if (!qrObj) { box.innerHTML = ''; qrObj = new QRCode(box, { width: 200, height: 200 }); }
    qrObj.clear();
    qrObj.makeCode(JSON.stringify({ s: sid, c: code }));
  }

  function fallbackCopy(text, okMsg) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    try { ta.select(); document.execCommand('copy'); Atlas.msg('m', okMsg, false); }
    catch (e) { Atlas.msg('m', 'Copy failed — select and copy manually.', true); }
    document.body.removeChild(ta);
  }

  function copyText(text, okMsg) {
    if (!text) { Atlas.msg('m', 'Nothing to copy yet — open a session first.', true); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        function () { Atlas.msg('m', okMsg, false); },
        function () { fallbackCopy(text, okMsg); }
      );
    } else {
      fallbackCopy(text, okMsg);
    }
  }

  Atlas.el('copyCode').onclick = function () {
    var code = Atlas.el('code').textContent;
    if (!code || code === '—') { Atlas.msg('m', 'Nothing to copy yet — open a session first.', true); return; }
    copyText(code, 'Code copied.');
  };

  Atlas.el('copyLink').onclick = function () {
    if (!sessionId) { Atlas.msg('m', 'Nothing to copy yet — open a session first.', true); return; }
    copyText(Atlas.joinLink(sessionId), 'Join link copied.');
  };

  async function pollFeed() {
    if (!sessionId) return;
    var r = await Atlas.api('GET', '/v1/attendance?session_id=' + sessionId);
    if (r.status !== 200) return;
    var list = Atlas.el('feed');
    list.innerHTML = (r.data.records || []).map(function (x) {
      var sc = x.status === 'present' ? 'badge--green' : x.status === 'absent' ? 'badge--red' : 'badge--yellow';
      return '<li>' +
        '<span class="text-muted text-xs" style="min-width:80px">Student #' + x.student_id + '</span>' +
        '<span class="badge ' + sc + '">' + x.status + '</span>' +
        '<span class="text-subtle text-xs ml-auto">' + fmtTime(x.recorded_at) + '</span>' +
        '</li>';
    }).join('') || '<li><span class="empty" style="padding:1.25rem 0;display:block">No check-ins yet.</span></li>';
  }

  function fmtTime(iso) {
    if (!iso) return '';
    try { return new Date(iso).toLocaleTimeString([], { timeStyle: 'short' }); }
    catch (e) { return iso; }
  }
})();
</script>
</body>
</html>
