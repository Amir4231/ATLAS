<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas — Admin</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="topbar">
  <a href="index.html" class="topbar__brand">
    <div class="topbar__brand-icon">A</div>
    Atlas
  </a>
  <div class="topbar__user">
    <span class="topbar__email" id="who"></span>
    <button class="btn btn--ghost btn--sm" id="out">Sign out</button>
  </div>
</nav>

<div class="page-wrap">
  <div class="page-header">
    <h1>Admin</h1>
    <p>College overview, class management, and system audit log.</p>
  </div>

  <!-- College stats -->
  <section>
    <div class="section-title">
      <div class="section-title__icon">🏫</div>
      <h2>College attendance</h2>
    </div>
    <div id="college" class="stats">
      <div class="stat">
        <div class="stat__label">Loading</div>
        <div class="stat__value">—</div>
      </div>
    </div>
  </section>

  <!-- Create class -->
  <section>
    <div class="section-title">
      <div class="section-title__icon">＋</div>
      <h2>Create class</h2>
    </div>
    <form id="cf">
      <div class="field-row">
        <div class="field">
          <label for="name">Class name</label>
          <input id="name" required placeholder="e.g. CS101 Group A">
        </div>
        <div class="field">
          <label for="tid">Homeroom teacher ID</label>
          <input id="tid" type="number" placeholder="Optional">
        </div>
      </div>
      <div class="field-row--3 field-row">
        <div class="field" style="margin:0">
          <label for="lat">Geofence latitude</label>
          <input id="lat" type="number" step="any" value="3.1390" required>
        </div>
        <div class="field" style="margin:0">
          <label for="lng">Geofence longitude</label>
          <input id="lng" type="number" step="any" value="101.6869" required>
        </div>
        <div class="field" style="margin:0">
          <label for="rad">Radius (m)</label>
          <input id="rad" type="number" value="30" required>
        </div>
      </div>
      <div class="btn-row">
        <button type="submit" id="createBtn" class="btn btn--primary">Create class</button>
      </div>
    </form>
    <div id="m" class="msg"></div>
  </section>

  <!-- Classes -->
  <section>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.1rem;padding-bottom:.875rem;border-bottom:1px solid var(--border)">
      <div class="flex items-center gap-2">
        <div class="section-title__icon" style="width:28px;height:28px;border-radius:6px;background:var(--accent-faint);display:flex;align-items:center;justify-content:center;font-size:.875rem">📚</div>
        <span style="font-size:.9375rem;font-weight:700;letter-spacing:-.01em">Classes</span>
      </div>
    </div>
    <ul id="cls" class="item-list">
      <li><span class="empty" style="padding:1.25rem 0;display:block">Loading…</span></li>
    </ul>
  </section>

  <!-- Audit log -->
  <section>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.1rem;padding-bottom:.875rem;border-bottom:1px solid var(--border)">
      <div class="flex items-center gap-2">
        <div class="section-title__icon" style="width:28px;height:28px;border-radius:6px;background:var(--accent-faint);display:flex;align-items:center;justify-content:center;font-size:.875rem">🔍</div>
        <span style="font-size:.9375rem;font-weight:700;letter-spacing:-.01em">Audit log</span>
      </div>
      <button id="audit" class="btn btn--secondary btn--sm">Refresh</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Actor</th>
            <th>Action</th>
            <th>Entity</th>
            <th>ID</th>
            <th>Time</th>
          </tr>
        </thead>
        <tbody id="logs">
          <tr><td colspan="6" class="empty" style="padding:1.5rem">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</div>

<script src="app.js"></script>
<script>
(function () {
  Atlas.el('out').onclick = Atlas.logout;

  Atlas.requireRole(['admin']).then(function (me) {
    if (!me) return;
    Atlas.el('who').textContent = me.email;
    loadCollege(); loadClasses(); loadAudit();
  });

  async function loadCollege() {
    var r = await Atlas.api('GET', '/v1/analytics/college');
    var box = Atlas.el('college');
    if (r.status !== 200) {
      box.innerHTML = '<div class="stat"><div class="stat__label">Error</div><div class="stat__value">—</div><div class="stat__sub">Could not load</div></div>';
      return;
    }
    var pct = r.data.pct || 0;
    var pctClass = pct >= 75 ? 'badge--green' : pct >= 50 ? 'badge--yellow' : 'badge--red';
    var label = pct >= 75 ? 'Good' : pct >= 50 ? 'Fair' : 'Low';
    box.innerHTML =
      '<div class="stat">' +
        '<div class="stat__label">Present today</div>' +
        '<div class="stat__value">' + (r.data.present || 0) + '</div>' +
        '<div class="stat__sub">of ' + (r.data.total || 0) + ' enrolled</div>' +
      '</div>' +
      '<div class="stat">' +
        '<div class="stat__label">Attendance rate</div>' +
        '<div class="stat__value">' + pct + '%</div>' +
        '<div class="stat__sub"><span class="badge ' + pctClass + '">' + label + '</span></div>' +
      '</div>';
  }

  document.getElementById('cf').addEventListener('submit', async function (e) {
    e.preventDefault();
    var btn = Atlas.el('createBtn');
    btn.classList.add('loading'); btn.disabled = true;
    var body = {
      class_name: Atlas.el('name').value.trim(),
      geofence_lat: +Atlas.el('lat').value,
      geofence_lng: +Atlas.el('lng').value,
      geofence_radius_m: +Atlas.el('rad').value
    };
    if (Atlas.el('tid').value) body.homeroom_teacher_id = +Atlas.el('tid').value;
    var r = await Atlas.api('POST', '/v1/admin/classes', body);
    btn.classList.remove('loading'); btn.disabled = false;
    if (r.status !== 200) { Atlas.msg('m', 'Create failed (' + r.status + '): ' + (r.data.error || ''), true); return; }
    Atlas.msg('m', 'Class #' + r.data.id + ' created successfully.', false);
    document.getElementById('cf').reset();
    loadClasses();
  });

  async function loadClasses() {
    var r = await Atlas.api('GET', '/v1/classes');
    if (r.status !== 200) return;
    Atlas.el('cls').innerHTML = r.data.classes.map(function (c) {
      return '<li>' +
        '<span class="badge badge--blue" style="flex-shrink:0">#' + c.id + '</span>' +
        '<span class="font-semibold">' + c.class_name + '</span>' +
        '<span class="text-subtle text-xs ml-auto" style="text-align:right">' +
          c.geofence_lat + ', ' + c.geofence_lng + ' · r=' + c.geofence_radius_m + 'm' +
        '</span>' +
        '</li>';
    }).join('') || '<li><span class="empty" style="padding:1.25rem 0;display:block">No classes created yet.</span></li>';
  }

  Atlas.el('audit').onclick = loadAudit;

  async function loadAudit() {
    var btn = Atlas.el('audit');
    btn.classList.add('loading'); btn.disabled = true;
    var r = await Atlas.api('GET', '/v1/audit-logs?limit=50');
    btn.classList.remove('loading'); btn.disabled = false;
    if (r.status !== 200) { Atlas.msg('m', 'Audit load failed (' + r.status + ').', true); return; }
    Atlas.el('logs').innerHTML = r.data.logs.map(function (l) {
      return '<tr>' +
        '<td class="text-subtle text-xs">' + l.id + '</td>' +
        '<td class="text-sm">' + (l.actor_id == null ? '<span class="text-subtle">—</span>' : l.actor_id) + '</td>' +
        '<td><code>' + l.action + '</code></td>' +
        '<td class="text-sm">' + l.entity + '</td>' +
        '<td class="text-subtle text-xs">' + l.entity_id + '</td>' +
        '<td class="text-subtle text-xs" style="white-space:nowrap">' + fmtTime(l.created_at) + '</td>' +
        '</tr>';
    }).join('') || '<tr><td colspan="6" class="empty" style="padding:1.5rem">No logs yet.</td></tr>';
  }

  function fmtTime(iso) {
    if (!iso) return '—';
    try { return new Date(iso).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' }); }
    catch (e) { return iso; }
  }
})();
</script>
</body>
</html>
